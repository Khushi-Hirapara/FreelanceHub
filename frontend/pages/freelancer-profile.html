<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelancer — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .profile-hero {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid var(--border);
    background:
      radial-gradient(900px 280px at 0% 0%, rgba(232,163,61,0.22), transparent 55%),
      linear-gradient(135deg, #171d35 0%, var(--ink) 55%, #0f1424 100%);
    color: var(--paper);
    padding: clamp(1.5rem, 3vw, 2.2rem);
    margin-bottom: var(--space-4);
  }
  .profile-hero-top {
    display: flex;
    gap: var(--space-4);
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .avatar-lg {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--amber); color: var(--ink);
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 2rem; font-weight: 600;
    flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.18);
  }
  .profile-hero h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    margin-bottom: 4px;
  }
  .profile-hero .title {
    color: rgba(247,245,240,0.72);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  .profile-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 18px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: rgba(247,245,240,0.7);
  }
  .profile-meta-row .stars { color: var(--amber); }
  .profile-meta-row .rate { color: #7dcea0; font-weight: 600; }
  .profile-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-left: auto;
    align-self: center;
  }
  .profile-actions .btn-outline {
    border-color: rgba(247,245,240,0.35);
    color: var(--paper);
  }
  .profile-actions .btn-outline:hover {
    background: var(--paper);
    color: var(--ink);
  }

  .profile-section {
    padding: clamp(1.25rem, 3vw, 1.75rem);
    margin-bottom: var(--space-4);
    border-radius: 16px;
  }
  .profile-section h2 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    margin-bottom: 10px;
  }
  .profile-section p {
    color: var(--slate);
    font-size: 0.95rem;
    line-height: 1.65;
  }

  .skills-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .skills-wrap .tag {
    border-radius: 999px;
    padding: 6px 12px;
  }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
  }
  .portfolio-item {
    aspect-ratio: 4/3;
    border-radius: 12px;
    background: var(--ink);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }
  .portfolio-item .overlay {
    background: linear-gradient(transparent, rgba(18,23,43,0.85));
    width: 100%;
    padding: 12px;
    color: var(--paper);
    font-size: 0.85rem;
  }

  .review-item {
    padding: var(--space-3) 0;
    border-bottom: 1px dashed var(--border);
  }
  .review-item:last-child { border-bottom: none; padding-bottom: 0; }
  .review-item:first-child { padding-top: 0; }
  .review-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-3);
    margin-bottom: 6px;
  }
  .review-top h4 { font-size: 0.95rem; font-weight: 600; }
  .review-stars {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--amber-deep);
  }
  .review-item p { font-size: 0.9rem; color: var(--slate); }
  .review-meta {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--slate-light);
    margin-top: 6px;
  }

  .profile-form { margin-top: var(--space-4); }
  .profile-form .form-group { margin-bottom: var(--space-3); }
  .profile-form label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .profile-form input,
  .profile-form textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--paper);
  }
  .profile-form input:focus,
  .profile-form textarea:focus { outline: none; border-color: var(--amber-deep); }
  .profile-form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .portfolio-actions { display: flex; gap: 8px; margin-top: 8px; }
  .message-box { margin-top: var(--space-3); }

  @media (max-width: 900px) {
    .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    .profile-actions { margin-left: 0; width: 100%; }
  }
  @media (max-width: 560px) {
    .portfolio-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="dash-layout">
  <aside class="sidebar" data-static-sidebar></aside>
  <main class="dash-main">
    <p style="margin-bottom:var(--space-3);">
      <a href="find-talent.html">← Back to Find Talent</a>
    </p>
    <div id="profileHero"></div>
    <div id="profileBody">
      <p style="color:var(--slate);">Loading profile…</p>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/hire.js"></script>
<script src="../js/freelancer-profile.js"></script>
</body>
</html>
