<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Detail — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .detail-page {
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-5) var(--space-4) var(--space-6);
  }

  .detail-card {
    padding: var(--space-5);
    margin-bottom: var(--space-4);
  }
  .detail-card .tag { margin-bottom: var(--space-3); }
  .detail-card h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    margin-bottom: var(--space-3);
    line-height: 1.2;
  }
  .detail-budget {
    font-family: var(--font-mono);
    color: var(--green);
    font-weight: 600;
    font-size: 1.15rem;
    margin-bottom: var(--space-4);
  }
  .detail-desc {
    color: var(--slate);
    font-size: 1rem;
    line-height: 1.65;
    margin-bottom: var(--space-4);
    white-space: pre-wrap;
  }

  .brief-meta-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px dashed var(--border);
    font-size: 0.9rem;
  }
  .brief-meta-row span:first-child { color: var(--slate-light); }
  .brief-meta-row span:last-child { font-weight: 600; }

  .brief-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: var(--space-4) 0 var(--space-2);
  }

  .client-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: var(--space-4);
    padding-top: var(--space-4);
    border-top: 1px solid var(--border);
  }
  .client-box .avatar-sm {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
  }
  .client-box h5 { font-size: 0.9rem; }
  .client-box span { font-size: 0.78rem; color: var(--slate-light); font-family: var(--font-mono); }

  .detail-actions {
    display: flex;
    gap: var(--space-3);
    flex-wrap: wrap;
    margin-top: var(--space-4);
  }

  .detail-back {
    margin-bottom: var(--space-4);
  }
  .status-badge {
    font-family: var(--font-mono); font-size: 0.7rem; padding: 3px 10px; border-radius: 20px;
    text-transform: uppercase;
  }
  .status-pending { background: rgba(232,163,61,0.15); color: var(--amber-deep); }
  .status-accepted { background: rgba(61,131,97,0.12); color: var(--green); }
  .status-rejected { background: rgba(178,58,58,0.1); color: #B23A3A; }

  .proposal-list { margin-top: var(--space-2); }
  .proposal-list h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin: 0 0 var(--space-3);
  }
  .proposal-card { padding: var(--space-4); margin-bottom: var(--space-3); }
  .proposal-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .proposal-top h3 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    margin-bottom: 4px;
  }
  .proposal-top h3 a:hover { color: var(--amber-deep); }
  .proposal-bid {
    color: var(--green);
    font-family: var(--font-mono);
    font-weight: 600;
    white-space: nowrap;
  }
  .proposal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    color: var(--slate);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    margin: 8px 0 12px;
  }
  .proposal-meta .stars { color: var(--amber-deep); }
  .proposal-letter {
    white-space: pre-wrap;
    color: var(--ink);
    font-size: 0.95rem;
    line-height: 1.55;
    margin-bottom: 12px;
  }
  .proposal-milestones { margin: 0 0 12px; padding-left: 18px; color: var(--slate); font-size: 0.9rem; }
  .proposal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .proposal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .recommend-panel { margin-top: var(--space-2); margin-bottom: var(--space-4); }
  .recommend-panel h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin: 0 0 6px;
  }
  .recommend-panel .muted { color: var(--slate); font-size: 0.9rem; margin-bottom: var(--space-3); }
  .recommend-card { padding: var(--space-4); margin-bottom: var(--space-3); }
  .recommend-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .recommend-person { display: flex; gap: 12px; align-items: flex-start; }
  .recommend-person .avatar-sm {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; flex-shrink: 0;
  }
  .recommend-person h3 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin: 0 0 2px;
  }
  .recommend-person h3 a:hover { color: var(--amber-deep); }
  .recommend-score {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--green);
    white-space: nowrap;
  }
  .recommend-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    color: var(--slate);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    margin: 8px 0;
  }
  .recommend-meta .stars { color: var(--amber-deep); }
  .recommend-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .recommend-reasons {
    margin: 0;
    padding-left: 18px;
    color: var(--slate);
    font-size: 0.9rem;
  }
  .recommend-foot { margin-top: 12px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links">
      <li><a href="find-talent.html">Find Talent</a></li>
      <li><a href="freelancer-dashboard.html">Find Work</a></li>
      <li><a href="messaging.html">Messages</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost">Log Out</a>
    </div>
  </div>
</nav>

<div class="detail-page">
  <div class="detail-back">
    <a href="freelancer-dashboard.html" id="backLink" class="btn btn-ghost btn-sm">← Back</a>
  </div>

  <div class="card detail-card" id="projectDetail">
    <span class="tag" id="projectCategory">Loading</span>
    <h1 id="projectTitle">Loading project…</h1>
    <div class="detail-budget" id="projectBudget">Budget: —</div>
    <p class="detail-desc" id="projectDescription">Fetching project details…</p>

    <div class="brief-tags" id="projectSkills"></div>

    <div class="brief-meta-row"><span>Status</span><span id="projectStatus">—</span></div>
    <div class="brief-meta-row"><span>Posted</span><span id="projectPosted">—</span></div>
    <div class="brief-meta-row"><span>Proposals so far</span><span id="projectProposals">—</span></div>
    <div class="brief-meta-row"><span>Deadline</span><span id="projectDeadline">—</span></div>
    <div class="brief-meta-row"><span>Experience level</span><span id="projectExperience">—</span></div>

    <div class="client-box">
      <div class="avatar-sm" id="clientAvatar">—</div>
      <div>
        <h5 id="clientName">Client</h5>
        <span id="clientMeta">Loading…</span>
      </div>
    </div>

    <div class="detail-actions" id="projectActions"></div>
  </div>

  <div id="recommendPanel" class="recommend-panel" style="display:none;"></div>
  <div id="proposalPanel"></div>
  <div id="projectFiles" class="card detail-card" style="display:none;"></div>
</div>

<script src="../js/api.js"></script>
<script src="../js/attachments.js"></script>
<script src="../js/main.js"></script>
<script src="../js/hire.js"></script>
<script src="../js/project-detail.js"></script>
</body>
</html>
