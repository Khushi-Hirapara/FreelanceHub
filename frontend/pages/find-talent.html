<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Talent — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .dash-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: var(--space-5);
  }
  .dash-header h1 { font-family: var(--font-display); font-size: 1.9rem; margin-bottom: 4px; }
  .dash-header p { color: var(--slate); font-size: 0.92rem; }
  .filters-bar {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-3);
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1; min-width: 220px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    background: var(--paper-raised);
  }
  .search-input:focus { outline: none; border-color: var(--amber-deep); }
  .filter-chip {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--slate);
    background: var(--paper-raised);
  }
  .filter-chip.active { border-color: var(--amber-deep); background: rgba(232,163,61,0.1); color: var(--ink); }
  .filter-group-label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--slate-light);
    width: 100%;
    margin-top: var(--space-2);
  }
  .talent-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-4);
    margin-top: var(--space-4);
  }
  .talent-card {
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .talent-card-top { display: flex; gap: var(--space-3); align-items: flex-start; }
  .talent-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--amber); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
    flex-shrink: 0;
  }
  .talent-card h3 { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 2px; }
  .talent-title { font-size: 0.85rem; color: var(--slate); }
  .talent-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 0.82rem;
  }
  .talent-rating .stars { color: var(--amber-deep); letter-spacing: 1px; }
  .talent-rate { color: var(--green); font-weight: 600; }
  .talent-bio { font-size: 0.88rem; color: var(--slate); line-height: 1.45; flex: 1; }
  .talent-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .talent-card .btn { width: 100%; }
  .talent-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: auto;
  }
  .talent-actions.single { grid-template-columns: 1fr; }
  .talent-actions .btn { width: 100%; }
  .talent-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-top: var(--space-5);
    padding: 14px 16px;
    background: var(--paper-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .talent-pager-meta {
    flex: 1;
    text-align: center;
    color: var(--slate);
    font-size: 0.88rem;
    font-family: var(--font-mono);
  }
  .talent-pager .btn {
    min-width: 108px;
  }
  .talent-pager .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  #noTalentResults {
    display: none; color: var(--slate); padding: var(--space-4) 0; grid-column: 1 / -1;
  }
  @media (max-width: 1100px) { .talent-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) {
    .talent-grid { grid-template-columns: 1fr; }
    .talent-actions { grid-template-columns: 1fr; }
    .talent-pager {
      flex-direction: column;
      text-align: center;
    }
    .talent-pager .btn { width: 100%; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="dash-layout">
  <aside class="sidebar" data-static-sidebar></aside>

  <main class="dash-main">
    <div class="dash-header">
      <div>
        <h1>Find Talent</h1>
        <p>Browse freelancers by skill, rating, and rate — hire the right hands for your brief.</p>
      </div>
      <a href="project-posting.html" class="btn btn-primary">+ Post a Project</a>
    </div>

    <div class="filters-bar">
      <input type="text" class="search-input" id="talentSearch" placeholder="Search by name, skill, or keyword…">
      <input type="text" class="search-input" id="talentLocation" placeholder="Location" style="flex:0 1 200px; min-width:160px;">
    </div>

    <div class="filters-bar">
      <span class="filter-group-label">Skill category</span>
      <button type="button" class="filter-chip filter-category active" data-category="all">All</button>
      <button type="button" class="filter-chip filter-category" data-category="web-dev">Web Dev</button>
      <button type="button" class="filter-chip filter-category" data-category="design">Design</button>
      <button type="button" class="filter-chip filter-category" data-category="writing">Writing</button>
      <button type="button" class="filter-chip filter-category" data-category="mobile">Mobile</button>
    </div>

    <div class="filters-bar">
      <span class="filter-group-label">Min rating</span>
      <button type="button" class="filter-chip filter-rating active" data-rating="0">Any</button>
      <button type="button" class="filter-chip filter-rating" data-rating="4">4.0+</button>
      <button type="button" class="filter-chip filter-rating" data-rating="4.5">4.5+</button>
      <button type="button" class="filter-chip filter-rating" data-rating="4.8">4.8+</button>
    </div>

    <div class="filters-bar">
      <span class="filter-group-label">Hourly rate</span>
      <button type="button" class="filter-chip filter-rate active" data-rate="all">Any rate</button>
      <button type="button" class="filter-chip filter-rate" data-rate="0-25">Under $25</button>
      <button type="button" class="filter-chip filter-rate" data-rate="25-50">$25–50</button>
      <button type="button" class="filter-chip filter-rate" data-rate="50-100">$50–100</button>
      <button type="button" class="filter-chip filter-rate" data-rate="100+">$100+</button>
    </div>

    <div class="talent-grid" id="talentGrid">
      <p id="talentStatus" style="color:var(--slate); grid-column:1 / -1;">Loading freelancers…</p>
    </div>

    <div class="talent-pager" id="talentPager" hidden>
      <button type="button" class="btn btn-outline btn-sm" id="talentPrev">← Previous</button>
      <span class="talent-pager-meta" id="talentPageLabel"></span>
      <button type="button" class="btn btn-outline btn-sm" id="talentNext">Next →</button>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/hire.js"></script>
<script src="../js/talent.js"></script>
</body>
</html>
