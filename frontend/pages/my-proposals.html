<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Proposals — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .dash-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.7rem, 3vw, 2rem);
    margin-bottom: 4px;
  }
  .dash-header p { color: var(--slate); font-size: 0.92rem; }

  .prop-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .prop-stat {
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--paper-raised);
  }
  .prop-stat .label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--slate-light);
  }
  .prop-stat .val {
    font-family: var(--font-display);
    font-size: 1.65rem;
    margin-top: 6px;
    line-height: 1;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: var(--space-4);
  }
  .filter-chip {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: var(--paper-raised);
    color: var(--slate);
    font-size: 0.82rem;
    font-weight: 600;
  }
  .filter-chip.active {
    border-color: var(--amber-deep);
    background: rgba(232,163,61,0.12);
    color: var(--ink);
  }

  .prop-list { display: grid; gap: 14px; }

  .proposal-item {
    padding: 20px 22px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--paper-raised);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .proposal-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-raised);
    border-color: rgba(232,163,61,0.45);
  }

  .proposal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 10px;
  }
  .proposal-item h3 {
    font-family: var(--font-display);
    font-size: 1.2rem;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .proposal-cat {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--slate-light);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .status-badge {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 4px 11px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .status-pending { background: rgba(232,163,61,0.16); color: var(--amber-deep); }
  .status-accepted { background: rgba(61,131,97,0.14); color: var(--green); }
  .status-rejected { background: rgba(178,58,58,0.12); color: #B23A3A; }
  .status-withdrawn { background: rgba(74,82,104,0.12); color: var(--slate); }

  .proposal-letter {
    color: var(--slate);
    font-size: 0.92rem;
    line-height: 1.5;
    margin: 12px 0 16px;
  }

  .proposal-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .proposal-metrics div {
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(18,23,43,0.03);
    border: 1px solid var(--border);
  }
  .proposal-metrics span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--slate-light);
    margin-bottom: 4px;
  }
  .proposal-metrics strong {
    font-size: 1rem;
  }
  .proposal-metrics .bid strong { color: var(--green); }

  .proposal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .proposal-foot .when {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--slate-light);
  }
  .proposal-ctas { display: flex; gap: 8px; flex-wrap: wrap; }

  .empty-box {
    padding: var(--space-6) var(--space-4);
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    text-align: center;
    background:
      radial-gradient(600px 200px at 50% 0%, rgba(232,163,61,0.1), transparent 60%),
      var(--paper-raised);
  }
  .empty-box h3 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  .empty-box p {
    color: var(--slate);
    max-width: 420px;
    margin: 0 auto var(--space-4);
  }

  @media (max-width: 960px) {
    .prop-stats { grid-template-columns: repeat(2, 1fr); }
    .proposal-metrics { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .dash-header { flex-direction: column; }
    .prop-stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="dash-layout">
  <aside class="sidebar" data-static-sidebar></aside>
  <main class="dash-main">
    <div class="dash-header">
      <div>
        <h1>My Proposals</h1>
        <p id="proposalsSub">Track bids you’ve submitted on open briefs.</p>
      </div>
      <a href="freelancer-dashboard.html" class="btn btn-primary">Browse Projects</a>
    </div>

    <div class="prop-stats" id="proposalStats" hidden>
      <div class="prop-stat"><div class="label">Total</div><div class="val" id="statTotal">0</div></div>
      <div class="prop-stat"><div class="label">Pending</div><div class="val" id="statPending">0</div></div>
      <div class="prop-stat"><div class="label">Accepted</div><div class="val" id="statAccepted">0</div></div>
      <div class="prop-stat"><div class="label">Rejected</div><div class="val" id="statRejected">0</div></div>
    </div>

    <div class="filter-row" id="proposalFilters" hidden>
      <button type="button" class="filter-chip active" data-filter="all">All</button>
      <button type="button" class="filter-chip" data-filter="pending">Pending</button>
      <button type="button" class="filter-chip" data-filter="accepted">Accepted</button>
      <button type="button" class="filter-chip" data-filter="rejected">Rejected</button>
    </div>

    <div id="proposalsList">
      <p style="color:var(--slate);padding:12px 0;">Loading your proposals…</p>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
