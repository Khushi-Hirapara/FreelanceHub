<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* Lock the page: only chat thread / conv list scroll */
  html, body {
    height: 100%;
    overflow: hidden;
  }
  .navbar {
    flex-shrink: 0;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .mobile-side-nav {
    flex-shrink: 0;
  }

  .dash-layout.msg-shell {
    flex: 1;
    min-height: 0;
    height: calc(100vh - 72px);
    max-height: calc(100vh - 72px);
    overflow: hidden;
  }
  .dash-layout.msg-shell .sidebar {
    position: relative;
    top: 0;
    height: 100%;
    max-height: 100%;
    align-self: stretch;
    overflow-y: auto;
  }
  .dash-layout.msg-shell .dash-main--flush {
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    overflow: hidden;
    padding: 0;
  }
  .msg-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }

  /* ---- Conversation list ---- */
  .conv-list-panel {
    background: var(--paper-raised);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }
  .conv-search {
    flex-shrink: 0;
    padding: var(--space-4);
    border-bottom: 1px solid var(--border);
  }
  .conv-search input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
  }
  .conv-search input:focus { outline: none; border-color: var(--amber-deep); }

  .conv-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .conv-item {
    display: flex; gap: 12px;
    padding: 14px var(--space-4);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .conv-item:hover { background: rgba(232,163,61,0.06); }
  .conv-item.active { background: rgba(232,163,61,0.1); border-left: 3px solid var(--amber); }
  .conv-item.ai-conv { background: rgba(232,163,61,0.04); }
  .conv-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    flex-shrink: 0;
  }
  .conv-avatar.ai-avatar,
  .ai-avatar {
    background: linear-gradient(135deg, var(--amber), #c97f1e);
    color: var(--ink);
  }
  .msg-bubble.ai-bubble { border-color: rgba(232,163,61,0.35); }
  .msg-bubble.ai-typing { opacity: 0.75; font-style: italic; }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top-row { display: flex; justify-content: space-between; align-items: baseline; }
  .conv-info h4 { font-size: 0.92rem; }
  .conv-time { font-size: 0.72rem; color: var(--slate-light); font-family: var(--font-mono); flex-shrink: 0; }
  .conv-preview { font-size: 0.82rem; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-project-tag { font-size: 0.7rem; color: var(--amber-deep); font-family: var(--font-mono); margin-top: 3px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex-shrink: 0; margin-top: 6px; }

  /* ---- Chat panel ---- */
  .chat-panel {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }
  .chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
    background: var(--paper-raised);
  }
  .chat-header-info { display: flex; align-items: center; gap: 12px; }
  .chat-header h3 { font-size: 1rem; }
  .chat-header span { font-size: 0.78rem; color: var(--slate-light); font-family: var(--font-mono); }
  .ws-state {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--slate);
  }
  .ws-state.live { color: var(--green); border-color: rgba(61,131,97,0.35); background: rgba(61,131,97,0.08); }
  .ws-state.fallback { color: var(--amber-deep); border-color: rgba(232,163,61,0.35); background: rgba(232,163,61,0.1); }
  .ws-state.offline { color: #B23A3A; border-color: rgba(178,58,58,0.25); background: rgba(178,58,58,0.08); }

  .chat-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .day-divider { text-align: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--slate-light); margin: var(--space-2) 0; }

  .msg-bubble { max-width: min(70%, 520px); padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.45; word-wrap: break-word; }
  .msg-bubble.received { align-self: flex-start; background: var(--paper-raised); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg-bubble.sent { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 2px; }
  .msg-time { display: block; font-family: var(--font-mono); font-size: 0.68rem; margin-top: 4px; opacity: 0.6; }

  .msg-attachment {
    align-self: flex-start;
    max-width: min(70%, 520px);
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-raised);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .msg-attachment .file-icon { font-family: var(--font-mono); color: var(--amber-deep); font-weight: 700; }

  .chat-input-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: var(--space-3) var(--space-4);
    border-top: 1px solid var(--border);
    background: var(--paper-raised);
  }
  .chat-input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.9rem;
  }
  .chat-input-bar input:focus { outline: none; border-color: var(--amber-deep); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--slate); font-family: var(--font-mono); font-size: 1rem;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(74,82,104,0.08); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--amber); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700;
  }
  .send-btn:hover { background: var(--amber-deep); }

  @media (max-width: 1100px) {
    .msg-layout { grid-template-columns: 280px 1fr; }
  }
  @media (max-width: 960px) {
    .dash-layout.msg-shell {
      height: calc(100vh - 72px - 57px);
      max-height: calc(100vh - 72px - 57px);
    }
  }
  @media (max-width: 860px) {
    .msg-layout { grid-template-columns: 1fr; }
    .conv-list-panel { display: none; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="dash-layout msg-shell">
  <aside class="sidebar" data-static-sidebar></aside>
  <main class="dash-main dash-main--flush">
<div class="msg-layout">
  <!-- Conversation list -->
  <div class="conv-list-panel">
    <div class="conv-search">
      <input type="text" placeholder="Search conversations...">
    </div>
    <div class="conv-list" id="convList">
      <p style="padding:16px;color:var(--slate);font-size:0.9rem;">Loading conversations…</p>
    </div>
  </div>

  <!-- Chat panel -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="conv-avatar" style="width:36px;height:36px;">—</div>
        <div>
          <h3 id="chatName">Select a conversation</h3>
          <span>Your messages will appear here</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="ws-state offline" id="wsState">Offline</span>
        <a href="find-talent.html" class="btn btn-outline btn-sm" id="chatBrowseLink">Browse</a>
      </div>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="day-divider">No conversation selected</div>
    </div>

    <div class="chat-input-bar">
      <button type="button" class="icon-btn" id="attachBtn" title="Attach file">+</button>
      <input type="file" id="attachInput" hidden>
      <input type="text" id="msgInput" placeholder="Ask FreelanceHub AI or message a contact…">
      <button class="send-btn" id="sendBtn">→</button>
    </div>
  </div>
</div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/attachments.js"></script>
<script src="../js/main.js"></script>
<script src="../js/messaging.js"></script>
</body>
</html>
