<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Work — FreelanceHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .dash-layout {
    /* shared in style.css */
  }
  /* page-local styles only below */  .dash-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: var(--space-5);
  }
  .dash-header h1 { font-family: var(--font-display); font-size: 1.9rem; margin-bottom: 4px; }
  .dash-header p { color: var(--slate); font-size: 0.92rem; }

  /* ---- Stat cards ---- */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat-card { padding: var(--space-3) var(--space-4); }
  .stat-card .eyebrow { font-size: 0.7rem; }
  .stat-card .val { font-family: var(--font-display); font-size: 1.9rem; margin: 6px 0 2px; }
  .stat-card .delta { font-size: 0.78rem; color: var(--green); font-family: var(--font-mono); }

  /* ---- Filters ---- */
  .filters-bar {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1; min-width: 220px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    background: var(--paper-raised);
  }
  .search-input:focus { outline: none; border-color: var(--amber-deep); }
  .filter-chip {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--slate);
    background: var(--paper-raised);
  }
  .filter-chip.active { border-color: var(--amber-deep); background: rgba(232,163,61,0.1); color: var(--ink); }

  /* ---- Project list ---- */
  .project-item {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
  }
  .project-item h3 { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 6px; }
  .project-item .meta { font-size: 0.85rem; color: var(--slate); margin-bottom: 8px; }
  .project-item .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .project-budget { font-family: var(--font-mono); font-weight: 600; color: var(--green); text-align: right; white-space: nowrap; }
  .project-budget .label { display: block; font-size: 0.7rem; color: var(--slate-light); font-weight: 400; text-transform: uppercase; }
  .project-proposals { font-family: var(--font-mono); font-size: 0.8rem; color: var(--slate); text-align: center; white-space: nowrap; }

  @media (max-width: 960px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .project-item { grid-template-columns: 1fr; text-align: left; }
    .project-budget, .project-proposals { text-align: left; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">Freelance<span>Hub</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="dash-layout">
  <aside class="sidebar" data-static-sidebar></aside>

  <main class="dash-main">
    <div class="dash-header">
      <div>
        <h1>Find Work</h1>
        <p>Browse open briefs and submit proposals.</p>
      </div>
      <a href="my-proposals.html" class="btn btn-primary">My Proposals</a>
    </div>

    <div class="stats-row">
      <div class="card stat-card">
        <span class="eyebrow">Active Bids</span>
        <div class="val">—</div>
        <div class="delta">Loading…</div>
      </div>
      <div class="card stat-card">
        <span class="eyebrow">Active Contracts</span>
        <div class="val">—</div>
        <div class="delta">Loading…</div>
      </div>
      <div class="card stat-card">
        <span class="eyebrow">Paid Earnings</span>
        <div class="val">—</div>
        <div class="delta">Loading…</div>
      </div>
      <div class="card stat-card">
        <span class="eyebrow">Rating</span>
        <div class="val">—</div>
        <div class="delta">Loading…</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" class="search-input" placeholder="Search projects by keyword, skill...">
      <button class="filter-chip active">All</button>
      <button class="filter-chip">Web Dev</button>
      <button class="filter-chip">Design</button>
      <button class="filter-chip">Writing</button>
      <button class="filter-chip">Under $500</button>
    </div>

    <div id="projectList">
      <p style="color:var(--slate);padding:12px 0;">Loading projects…</p>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
